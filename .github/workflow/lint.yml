name: lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run textlint
        run: bun run lint

      - name: Run markdownlint
        run: bun run mdlint

      - name: Run cspell
        run: bun run spell
